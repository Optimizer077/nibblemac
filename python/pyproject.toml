[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "pinfer"
version = "0.3.0"  # keep equal to PINFER_VERSION_* in engine/include/pinfer.h (tested)
description = "Raspberry-Pi-4-native inference engine for Qwen3.5 (C library + Python API + CLI)"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
    "tokenizers>=0.15",
]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
chat = ["jinja2>=3.1"]          # render the model's own chat template (built-in fallback otherwise)
test = ["pytest>=7", "jinja2>=3.1"]

[project.scripts]
pinfer = "pinfer.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["pinfer"]

# Bundles libpinfer.so (+ BUILD_INFO.json, tools/convert.py) and sets the platform tag.
# Build through `make -C engine wheel-host` / `wheel-pi` (sets PINFER_WHEEL_ARCH).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = ["pinfer", "hatch_build.py", "pyproject.toml"]
