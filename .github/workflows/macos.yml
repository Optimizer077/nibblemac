name: macOS build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build inherited scalar CPU tools
        run: make cpu-reference
      - name: Compile Metal host runtime
        run: make metal
      - name: Test benchmark gating and failure records (no GPU required)
        run: python3 tests/test_bench_metal.py
      - name: Cross-compile original NEON model backend for Apple Silicon
        run: make -s -C engine/macos BACKEND=cpu-baseline CPU=apple-m2 CC="xcrun clang -arch arm64"
      - name: Cross-compile SDOT model backend for Apple Silicon
        run: make -s -C engine/macos BACKEND=cpu CPU=apple-m2 CC="xcrun clang -arch arm64"
      - name: Cross-compile hybrid model backend for Apple Silicon
        run: make -s -C engine/macos BACKEND=metal CPU=apple-m2 CC="xcrun clang -arch arm64"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model-tool dependencies
        run: python -m pip install -r requirements-macos.txt
      - name: Test inference benchmark configurations
        run: python tests/test_inference_harness.py
      # Hosted macOS VMs need not expose a Metal GPU. Actual GPU correctness and
      # performance must be checked separately on a physical Apple Silicon Mac.
